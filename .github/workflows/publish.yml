name: Test and release

# Every push to master builds and tests the package. If the version in setup.py
# differs from the latest version on PyPI, the commit is tagged, a GitHub release is
# created and the package is published to PyPI.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  PACKAGE: opencosmorspy

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install . pytest
      - run: python -m pytest tests -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  release:
    name: Tag and release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Compare the built version with the latest version on PyPI
        id: version
        run: |
          sdist="$(ls dist/${PACKAGE}-*.tar.gz)"
          built="$(basename "$sdist" .tar.gz)"
          built="${built#${PACKAGE}-}"
          code="$(curl --silent --output pypi.json --write-out '%{http_code}' "https://pypi.org/pypi/${PACKAGE}/json")"
          if [[ $code == 200 ]]; then
            published="$(jq --raw-output .info.version pypi.json)"
          elif [[ $code == 404 ]]; then
            published="none"
          else
            echo "Could not query PyPI (HTTP $code)"; exit 1
          fi
          echo "Built version: $built, latest published version: $published"
          echo "version=$built" >> "$GITHUB_OUTPUT"
          if [[ $built != "$published" && $GITHUB_EVENT_NAME == "push" && $GITHUB_REF_NAME == "master" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the commit and create a GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
